name: DayBounties
version: 1.0.0
main: com.bughatti.daybounties.Main
api-version: '1.20'
author: Bughatti
depend: [Vault]

commands:
  bounty:
    description: Comando principal de DayBounties
    usage: /bounty <set|claim|list|cancel|help>
    aliases: [bounties, db]

permissions:
  daybounties.use:
    description: Permite usar el comando /bounty
    default: true
  daybounties.set:
    description: Permite colocar recompensas
    default: true
  daybounties.claim:
    description: Permite reclamar recompensas
    default: true
  daybounties.admin:
    description: Permite administrar DayBounties
    default: op
